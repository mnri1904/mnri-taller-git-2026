spring.application.name=mnri-taller-git-2026
spring.datasource.url=jdbc:h2:file:./data/minecraft
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.paths-to-match=/api/minecraft/entidades,/api/minecraft/entidades/**
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
companeros.alexandre.url=${ALEXANDRE_API_URL:http://localhost:8082}
